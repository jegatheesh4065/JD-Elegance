<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Email | JD ELEGANCE</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #f5f0e8, #e8dfd2);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    /* EMAIL CARD */

    .email-card {
        width: 470px;
        max-width: 100%;
        background: #ffffff;
        padding: 50px 45px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 25px 70px rgba(40, 30, 15, 0.18);
        border: 1px solid rgba(183, 145, 76, 0.25);
        position: relative;
        overflow: hidden;
        animation: fadeIn 0.6s ease;
    }

    .email-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: linear-gradient(90deg, #b38a42, #e4c17c, #b38a42);
    }

    /* BRAND */

    .brand {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #b38a42;
        margin-bottom: 38px;
    }

    .brand span {
        color: #222222;
        font-weight: 300;
    }

    /* EMAIL ICON */

    .email-icon {
        width: 85px;
        height: 85px;
        margin: 0 auto 28px;
        border-radius: 24px;
        background: linear-gradient(135deg, #e4c17c, #b38a42);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: #171717;
        box-shadow: 0 10px 25px rgba(179, 138, 66, 0.2);
    }

    /* HEADING */

    h1 {
        font-size: 28px;
        color: #1b1b1b;
        margin-bottom: 14px;
        font-weight: 750;
        letter-spacing: -0.5px;
    }

    .message {
        color: #817b72;
        font-size: 14px;
        line-height: 1.8;
        margin-bottom: 28px;
    }

    /* INFORMATION BOX */

    .info-box {
        background: #fcfaf5;
        border: 1px solid #eee4d1;
        border-radius: 12px;
        padding: 16px;
        color: #777168;
        font-size: 12px;
        line-height: 1.8;
        margin-bottom: 28px;
        display: flex;
        align-items: flex-start;
        text-align: left;
        gap: 11px;
    }

    .info-box i {
        color: #b38a42;
        font-size: 16px;
        margin-top: 2px;
    }

    /* LOGIN BUTTON */

    .login-btn {
        display: block;
        width: 100%;
        padding: 16px 12px;
        background: linear-gradient(110deg, #b38a42, #dfc17e);
        color: #171717;
        text-decoration: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.7px;
        transition: all 0.3s ease;
        box-shadow: 0 8px 18px rgba(179, 138, 66, 0.2);
    }

    .login-btn:hover {
        background: linear-gradient(110deg, #d3ad61, #b38a42);
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(179, 138, 66, 0.3);
    }

    /* FOOTER */

    .footer {
        margin-top: 28px;
        color: #aaa49a;
        font-size: 11px;
        letter-spacing: 0.4px;
    }

    /* ANIMATION */

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(12px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* MOBILE RESPONSIVE */

    @media (max-width: 480px) {
        body {
            padding: 15px;
        }

        .email-card {
            padding: 40px 25px;
            border-radius: 16px;
        }

        .brand {
            font-size: 21px;
            margin-bottom: 32px;
        }

        .email-icon {
            width: 72px;
            height: 72px;
            font-size: 27px;
            border-radius: 20px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 25px;
        }

        .message {
            font-size: 13px;
        }

        .info-box {
            padding: 13px;
            font-size: 12px;
        }

        .login-btn {
            font-size: 12px;
        }
    }
</style>

</head>

<body>

<div class="email-card">

    <div class="brand">
        JD <span>ELEGANCE</span>
    </div>


    <div class="email-icon">

        <i class="fa-regular fa-envelope"></i>

    </div>


    <h1>
        Check Your Email
    </h1>


    <p class="message">

        We've sent a password reset link to your
        registered email address.

    </p>


    <div class="info-box">

        <i class="fa-solid fa-circle-info"></i>

        Open the email and click the reset link
        to create your new password.

    </div>


    <a href="{% url 'admin_login' %}" class="login-btn">

        BACK TO ADMIN LOGIN

    </a>


    <div class="footer">

        JD ELEGANCE • Secure Admin Panel

    </div>

</div>

</body>
</html>
