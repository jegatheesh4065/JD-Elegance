<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #f5f0e8, #e8dfd2);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
    }

    .login-wrapper {
        width: 950px;
        min-height: 590px;
        background: #ffffff;
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        box-shadow: 0 25px 70px rgba(40, 30, 15, 0.18);
        border: 1px solid rgba(183, 145, 76, 0.25);
    }

    /* LEFT SIDE */

    .login-left {
        width: 45%;
        background: linear-gradient(145deg, #111111, #29251f, #171717);
        color: #ffffff;
        padding: 55px 45px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
    }

    .login-left::before {
        content: "";
        position: absolute;
        width: 260px;
        height: 260px;
        border: 1px solid rgba(212, 175, 100, 0.2);
        border-radius: 50%;
        top: -100px;
        right: -100px;
    }

    .login-left::after {
        content: "";
        position: absolute;
        width: 200px;
        height: 200px;
        border: 1px solid rgba(212, 175, 100, 0.15);
        border-radius: 50%;
        bottom: -100px;
        left: -80px;
    }

    .brand {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #d9b56d;
        position: relative;
        z-index: 1;
    }

    .brand span {
        color: #ffffff;
        font-weight: 300;
    }

    .left-content {
        margin-top: 40px;
        position: relative;
        z-index: 1;
    }

    .left-content .icon {
        width: 70px;
        height: 70px;
        border-radius: 18px;
        background: linear-gradient(135deg, #e4c17c, #b38a42);
        color: #171717;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 28px;
        box-shadow: 0 10px 25px rgba(212, 175, 100, 0.2);
    }

    .left-content h1 {
        font-size: 37px;
        line-height: 1.25;
        margin-bottom: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .left-content p {
        color: #c8c4bd;
        line-height: 1.9;
        font-size: 14px;
        max-width: 300px;
    }

    .security {
        font-size: 12px;
        color: #c9b98f;
        letter-spacing: 0.5px;
        position: relative;
        z-index: 1;
    }

    .security i {
        margin-right: 8px;
        color: #d9b56d;
    }

    /* RIGHT SIDE */

    .login-right {
        width: 55%;
        padding: 55px 65px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #ffffff;
    }

    .login-right h2 {
        font-size: 31px;
        color: #1b1b1b;
        margin-bottom: 10px;
        font-weight: 750;
        letter-spacing: -0.5px;
    }

    .login-subtitle {
        color: #8b867e;
        font-size: 14px;
        margin-bottom: 35px;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 23px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 650;
        color: #33302a;
        margin-bottom: 10px;
    }

    .input-box {
        position: relative;
    }

    .input-box i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #a28a5b;
        font-size: 15px;
        transition: 0.25s;
    }

    .input-box input {
        width: 100%;
        height: 52px;
        border: 1px solid #e5e0d7;
        border-radius: 10px;
        padding: 0 16px 0 46px;
        outline: none;
        font-size: 14px;
        color: #252525;
        background: #fcfbf9;
        transition: all 0.3s ease;
    }

    .input-box input::placeholder {
        color: #aaa49a;
        font-size: 13px;
    }

    .input-box input:focus {
        border-color: #b99653;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(185, 150, 83, 0.12);
    }

    .input-box:focus-within i {
        color: #b38a42;
    }

    /* LOGIN OPTIONS */

    .login-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
    }

    .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #777168;
        cursor: pointer;
    }

    .remember input {
        accent-color: #b38a42;
        cursor: pointer;
    }

    .forgot {
        color: #9b7839;
        font-size: 12px;
        text-decoration: none;
        font-weight: 650;
        transition: 0.3s;
    }

    .forgot:hover {
        color: #171717;
        text-decoration: underline;
    }

    /* LOGIN BUTTON */

    .login-btn {
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(110deg, #b38a42, #dfc17e);
        color: #171717;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 18px rgba(179, 138, 66, 0.2);
    }

    .login-btn:hover {
        background: linear-gradient(110deg, #d3ad61, #b38a42);
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(179, 138, 66, 0.3);
    }

    .login-btn:active {
        transform: translateY(0);
    }

    /* ERROR MESSAGE */

    .error-message {
        background: #fff3f1;
        color: #bd3930;
        border: 1px solid #f2d0cc;
        padding: 13px 15px;
        border-radius: 9px;
        font-size: 13px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
        line-height: 1.5;
    }

    /* FOOTER */

    .footer-text {
        text-align: center;
        margin-top: 30px;
        font-size: 11px;
        color: #aaa49a;
        letter-spacing: 0.4px;
    }

    /* TABLET & MOBILE */

    @media (max-width: 850px) {
        .login-wrapper {
            width: 100%;
            max-width: 650px;
        }

        .login-left {
            padding: 40px 30px;
        }

        .login-right {
            padding: 45px 35px;
        }

        .left-content h1 {
            font-size: 30px;
        }
    }

    @media (max-width: 650px) {
        body {
            padding: 15px;
            align-items: flex-start;
        }

        .login-wrapper {
            max-width: 430px;
            flex-direction: column;
            border-radius: 16px;
            margin: auto;
        }

        .login-left,
        .login-right {
            width: 100%;
        }

        .login-left {
            min-height: 250px;
            padding: 30px;
        }

        .brand {
            font-size: 22px;
        }

        .left-content {
            margin-top: 30px;
        }

        .left-content .icon {
            width: 52px;
            height: 52px;
            font-size: 22px;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        .left-content h1 {
            font-size: 27px;
            margin-bottom: 12px;
        }

        .left-content p {
            font-size: 13px;
            line-height: 1.7;
        }

        .security {
            display: none;
        }

        .login-right {
            padding: 35px 25px;
        }

        .login-right h2 {
            font-size: 27px;
        }

        .login-subtitle {
            margin-bottom: 28px;
        }
    }

    @media (max-width: 360px) {
        .login-options {
            align-items: flex-start;
        }

        .remember,
        .forgot {
            font-size: 11px;
        }

        .login-right {
            padding: 30px 20px;
        }
    }
</style>

</head>


<body>


<div class="login-wrapper">


    <!-- LEFT -->

    <div class="login-left">

        <div class="brand">
            JD &nbsp;<span>ELEGANCE</span>
        </div>


        <div class="left-content">

            <div class="icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h1>
                Welcome<br>
                Back, Admin.
            </h1>

            <p>
                Manage your products, orders, categories
                and store activities from one place.
            </p>

        </div>


        <div class="security">

            <i class="fa-solid fa-lock"></i>

            Secure administrator access

        </div>

    </div>



    <!-- RIGHT -->

    <div class="login-right">

        <h2>
            Admin Login
        </h2>

        <p class="login-subtitle">
            Sign in to access your dashboard
        </p>


        {% if error %}

        <div class="error-message">

            <i class="fa-solid fa-circle-exclamation"></i>

            {{ error }}

        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label>
                    Username
                </label>

                <div class="input-box">

                    <i class="fa-regular fa-user"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="login-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Remember me

                </label>


                <a
                    href="{% url 'password_reset' %}"
                    class="forgot"
                >
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
            >

                Sign In

            </button>


        </form>


        <div class="footer-text">

            Admin panel • Secure access

        </div>

    </div>

</div>


</body>

</html>
