<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JD ELEGANCE Password Reset</title>
</head>

<body style="margin:0; padding:40px; background:#f5f3ef; font-family:Arial,sans-serif;">

    <div style="
        max-width:600px;
        margin:auto;
        background:white;
        padding:40px;
        border-radius:12px;
        text-align:center;
    ">

        <h1 style="
            letter-spacing:5px;
            color:#111;
        ">
            JD ELEGANCE
        </h1>

        <h2>Password Reset</h2>

        <p>
            Hello {{ user.username }},
        </p>

        <p>
            We received a request to reset your admin account password.
        </p>

        <p>
            Click the button below to create a new password.
        </p>

        <div style="margin:35px 0;">

            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
               style="
               background:#111;
               color:#fff;
               padding:15px 30px;
               text-decoration:none;
               border-radius:6px;
               font-weight:bold;
               display:inline-block;
               ">
                RESET PASSWORD
            </a>

        </div>

        <p style="font-size:13px; color:#777;">
            If you did not request this password reset,
            you can safely ignore this email.
        </p>

        <hr>

        <p style="font-size:12px; color:#999;">
            © JD ELEGANCE
        </p>

    </div>

</body>
</html>
